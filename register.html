<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - ReMarket</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="header"><a href="index.html" class="logo"><span>re</span>Market</a><nav class="nav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="sell.html">Sell</a><a href="dashboard.html">My Listings</a><a href="about.html">About</a></nav><div class="header-actions" id="headerActions"></div></header>
<main class="auth-page"><div class="auth-card"><div class="auth-heading"><p class="eyebrow">CREATE ACCOUNT</p><h1>Join ReMarket</h1><p>Create an account to buy and sell pre-owned items.</p></div>
<form id="registerForm"><div class="form-group"><label for="registerName">Full Name</label><input type="text" id="registerName" placeholder="Enter your full name" required></div><div class="form-group"><label for="registerEmail">Email Address</label><input type="email" id="registerEmail" placeholder="Enter your email" required></div><div class="form-group"><label for="registerPassword">Password</label><input type="password" id="registerPassword" placeholder="Create a password" required></div><div class="form-group"><label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" placeholder="Confirm your password" required></div><button type="submit" class="auth-button">Create Account</button></form>
<p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p></div></main>
<footer class="footer"><div class="footer-logo"><span>re</span>Market</div><p>A simple marketplace for giving products a second life.</p><div class="footer-line"></div><small>© 2026 ReMarket. All rights reserved.</small></footer>
<script src="js/script.js"></script>
